name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # No separate `tsc --noEmit` step. Next generates the global types the
      # app relies on (LayoutProps, PageProps) into .next/types during the
      # build, so type-checking ahead of it fails on a clean checkout -- and
      # type-checking after it would only repeat what the build already did.
      - name: Build
        run: npm run build

  migrations:
    name: Migrations — up, down, up on an empty database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Same image as compose. Deliberately without infra/postgres/init/, so
        # the migration has to create its own extensions -- exactly the state a
        # fresh VPS database starts in.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devpath
          POSTGRES_PASSWORD: devpath
          POSTGRES_DB: devpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpath -d devpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://devpath:devpath@localhost:5432/devpath

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Downgrade to base and back up
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check for un-migrated model changes
        run: alembic check
