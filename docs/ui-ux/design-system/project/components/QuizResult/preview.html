<!-- @dsCard group="Trạng thái" height=284 subtitle="Kết quả quiz theo 4 mức: party, proud, cheer, comfort" -->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>QuizResult</title></head>
<body>
<div class="dp-stage">
  <div class="dp-grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">
    <div class="dp-quiz dp-q-party">
      <svg class="dp-ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="dp-ring-track" cx="32" cy="32" r="28"/><circle class="dp-ring-fill" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="0"/></svg>
      <div class="dp-col"><span class="numeral dp-num">100%</span><span class="title">Đúng cả 10/10 câu</span><span class="body-sm">+20 XP · đạt từ 80%</span></div>
    </div>
    <div class="dp-quiz dp-q-proud">
      <svg class="dp-ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="dp-ring-track" cx="32" cy="32" r="28"/><circle class="dp-ring-fill" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="26.39"/></svg>
      <div class="dp-col"><span class="numeral dp-num">85%</span><span class="title">Đạt, 17/20 câu đúng</span><span class="body-sm">Xem lại 3 câu sai bên dưới.</span></div>
    </div>
    <div class="dp-quiz dp-q-cheer">
      <svg class="dp-ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="dp-ring-track" cx="32" cy="32" r="28"/><circle class="dp-ring-fill" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="70.37"/></svg>
      <div class="dp-col"><span class="numeral dp-num">60%</span><span class="title">Gần đạt: 12/20 câu</span><span class="body-sm">Cần 80%. Làm lại được ngay.</span></div>
    </div>
    <div class="dp-quiz dp-q-comfort">
      <svg class="dp-ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="dp-ring-track" cx="32" cy="32" r="28"/><circle class="dp-ring-fill" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="123.15"/></svg>
      <div class="dp-col"><span class="numeral dp-num">30%</span><span class="title">Chưa đạt: 6/20 câu</span><span class="body-sm">Ôn lại bài 4 rồi thử lần nữa.</span></div>
    </div>
  </div>
</div>
</body>
</html>
