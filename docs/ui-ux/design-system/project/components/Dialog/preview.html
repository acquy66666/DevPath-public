<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="dp-stage">
  <div class="dp-overlay">
    <div class="dp-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
      <div class="h3" id="dlg-title">Xóa bài "Vòng lặp for"?</div>
      <p class="body-sm dp-muted" id="dlg-desc" style="margin:0">Bài học, bài tập code và 12 ghi chú của học viên trong bài sẽ bị xóa. Không hoàn tác được.</p>
      <div class="dp-dialog-actions">
        <button class="dp-btn dp-btn-outline" type="button">Hủy</button>
        <button class="dp-btn dp-btn-destructive" type="button">Xóa bài học</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
