<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Robot màn hình cầm bản đồ ngược, lạc đường">
  <g id="antenna">
    <path d="M100 38 L100 21" stroke="#05332b" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="100" cy="15" r="7" fill="#ffc84c" stroke="#05332b" stroke-width="3.5"/>
  </g>
  <g id="ears" fill="#ccf5ea" stroke="#05332b" stroke-width="3.5">
