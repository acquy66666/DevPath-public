# The production shape, cut down to the one route under test: the bucket
# answers on the site's own origin, so a browser upload is same-origin (no
# CORS rules to keep in step with the frontend) and nothing but nginx faces
# the internet. UPSTREAM is filled in by run.sh.
events {}

http {
    server {
        listen 443 ssl;
        server_name spike-front;
        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        # `= /devpath-media` too: bucket-level calls (ListObjectsV2,
        # DeleteObjects) have no trailing slash. Nothing else of the S3 API is
        # routed -- no other bucket, no bucket creation, no admin endpoints.
        location = /devpath-media { proxy_pass http://UPSTREAM; include /etc/nginx/s3_proxy.conf; }
        location /devpath-media/  { proxy_pass http://UPSTREAM; include /etc/nginx/s3_proxy.conf; }

        location / { return 404; }
    }
}
