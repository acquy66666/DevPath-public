# Behind the Cloudflare named tunnel only: docker-compose.named-tunnel.yml
# mounts this file into conf.d (http level, so both server blocks get it). The
# real server leaves it out, and its nginx stays the first hop it always was.
#
# Why it exists. Behind the tunnel, the peer nginx sees is cloudflared, for
# every visitor alike. proxy.conf overwrites X-Forwarded-For with that peer, so
# before this file the API saw one client for the whole internet: the sign-up
# limit (50/hour/address) and the sign-in limit (100/15 min/address) were one
# bucket for a classroom, and every row of refresh_tokens.ip_address was the
# container's. docs/report/assets/phase-6/tunnel-real-ip.txt
#
# Cloudflare's edge writes the visitor's address into CF-Connecting-IP, and
# cloudflared hands it on. The header is honoured from exactly one peer: the
# address docker-compose.named-tunnel.yml pins cloudflared to, on a network of
# its own that only nginx shares. Not a subnet. nginx also publishes 80 and 443
# on the host, and those connections arrive from a Docker gateway -- measured
# on this machine, from the same /16 as cloudflared on the default network --
# so trusting a range would let anybody who reaches the port name any address
# they like, past the per-address limits and into the sessions list. From any
# other peer the header is ignored and the peer itself is the client.
#
# Change the address here and in the overlay together; CI checks they agree,
# and that a request from any other address keeps its own.
set_real_ip_from 10.250.250.3;
real_ip_header CF-Connecting-IP;
