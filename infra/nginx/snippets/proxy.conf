# Everything an upstream needs to know about the request nginx received,
# because from inside the compose network it cannot tell any of this itself.
#
# Not run through envsubst: only files under templates/ are, and there is
# nothing here to substitute.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;

# Overwritten, not appended to. nginx is the first hop -- nothing sits in front
# of it -- so the address it saw is the only one worth passing on. Appending
# ($proxy_add_x_forwarded_for) would keep whatever the client wrote in its own
# X-Forwarded-For at the front of the list, and uvicorn, told to trust every
# proxy (`--forwarded-allow-ips *`), takes the front of the list as the client.
# That would let anybody choose their own address: past the per-address sign-in
# limit, and into the sessions list as whoever they like.
#
# If a CDN is ever put in front of nginx, this becomes the CDN's address and
# has to be taken from the CDN's own header instead, behind set_real_ip_from.
proxy_set_header X-Forwarded-For $remote_addr;

# Without this, uvicorn and Next both believe the request arrived over plain
# HTTP -- which is how an app ends up redirecting to http:// and writing a
# cookie it marked Secure onto a connection it thinks is not.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_redirect off;
