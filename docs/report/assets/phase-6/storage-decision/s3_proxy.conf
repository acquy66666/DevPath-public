# SigV4 signs the Host header: the server must see the host the URL was
# signed for, not the upstream's name.
proxy_set_header Host $host;
proxy_http_version 1.1;
# Original videos are uploaded whole through a presigned PUT; stream them
# instead of spooling to nginx's disk first, and do not cap their size here
# (the API decides what may be uploaded when it signs the URL).
client_max_body_size 0;
proxy_request_buffering off;
proxy_buffering off;
