# Development stack — `docker compose up` from this directory brings up
# everything the platform needs. The VPS runs docker-compose.prod.yml instead,
# which is a separate file rather than an override: this one publishes database
# ports and bind-mounts source, and an override can add to a list but never
# take something off one.
name: devpath

x-backend-env: &backend-env
  ENV: development
  DEBUG: "true"
  # Hostnames are compose service names, not localhost: each service is its
  # own network namespace.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devpath}:${POSTGRES_PASSWORD:-devpath}@postgres:5432/${POSTGRES_DB:-devpath}
  REDIS_URL: redis://redis:6379/0
  # Dev default only; the VPS .env must set a real one or the app refuses
  # to start (see Settings.reject_the_dev_secret_in_production).
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
  # Empty by default: the Google endpoints answer 503 until an OAuth client
  # exists. Put real values in infra/.env to switch them on.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
  FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
  # How often one student may ask for grading. Enforced by the API before a
  # row is written or a job queued; see backend/app/services/rate_limit.py.
  SUBMISSION_COOLDOWN_SECONDS: ${SUBMISSION_COOLDOWN_SECONDS:-10}
  SUBMISSION_HOURLY_LIMIT: ${SUBMISSION_HOURLY_LIMIT:-40}
  # Object storage. Production uses Cloudflare R2; here every R2_* defaults to
  # the `minio` service below, so video, avatar and transcript uploads work on
  # a fresh clone with no account anywhere. The app only speaks S3 and never
  # knows which one it is talking to.
  #
  # To use a real R2 bucket from this stack instead, set all of them in
  # infra/.env -- R2_ENDPOINT_URL included, as
  # https://<account id>.r2.cloudflarestorage.com. Left empty it falls back to
  # MinIO, not to R2. See docs/huong-dan-cloudflare-r2.md.
  #
  # `minio.localhost`, not `minio`: a presigned URL is signed for one host, and
  # the same URL is used by the browser (PUT an upload, GET a video) and by the
  # workers (download the original, upload the HLS output). Browsers send any
  # *.localhost to 127.0.0.1, where port 9000 is published; inside the compose
  # network the same name is an alias of the service. One name, both sides.
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-devpath}}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-devpath-minio}}
  R2_BUCKET: ${R2_BUCKET:-devpath-media}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-http://minio.localhost:9000/${R2_BUCKET:-devpath-media}}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-http://minio.localhost:9000}
  # Gemini. Empty by default: the ingest job and the chat endpoints say
  # "chưa cấu hình" rather than failing. Put a real key in infra/.env.
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
  GEMINI_CHAT_THINKING_LEVEL: ${GEMINI_CHAT_THINKING_LEVEL:-minimal}
  # VNPay. Empty by default: `POST /orders/{code}/payment-url` answers 503
  # "chưa cấu hình" until somebody registers a merchant at sandbox.vnpayment.vn
  # and puts the two values in infra/.env. The IPN endpoint refuses every
  # callback while they are empty, because with no secret there is nothing to
  # check a signature against.
  #
  # Any pair of values switches the flow on locally -- `scripts.simulate_vnpay_ipn`
  # signs with the same secret the backend verifies with, so the whole
  # order -> callback -> enrolment path is demonstrable without an account.
  # Only the bank's own page needs the real ones.
  VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
  VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
  VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:${FRONTEND_PORT:-3000}/thanh-toan/ket-qua}
  CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
  # The Windows host's filesystem events do not cross into the Linux VM, so
  # the reloader has to poll for changes instead of waiting to be told.
  WATCHFILES_FORCE_POLLING: "true"

x-backend-volumes: &backend-volumes
  - ../backend:/app
  # Anonymous volume: keeps the host's Windows virtualenv out of the container,
  # where its executables would not run anyway.
  - /app/.venv

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpath}
      POSTGRES_DB: ${POSTGRES_DB:-devpath}
    ports:
      # Published so Alembic and psql can run from the host venv.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devpath} -d ${POSTGRES_DB:-devpath}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    # Append-only file: a restart must not drop queued jobs.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible storage standing in for Cloudflare R2, on this machine only.
  # docker-compose.prod.yml has no counterpart: production talks to R2.
  #
  # Bitnami's frozen build, not minio/minio: MinIO stopped publishing images
  # of its community edition and both minio/minio and minio/mc are gone from
  # Docker Hub (checked 18/09/2026). This one still pulls, and it creates the
  # bucket itself, so there is no init container. It is not updated any more,
  # which is acceptable for a local stand-in bound to 127.0.0.1 and not for
  # anything else. Swapping it for another S3 server touches only this block.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devpath}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devpath-minio}
      # `download` = anonymous GET, which is what a public R2 bucket gives the
      # HLS player and <img>. Writes still need a signature.
      MINIO_DEFAULT_BUCKETS: ${R2_BUCKET:-devpath-media}:download
      # The page PUTs uploads and hls.js fetches segments straight from here,
      # both cross-origin.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      # Fixed at 9000, unlike the other ports: it is part of the URLs signed
      # and stored above, and inside the network the service listens on 9000.
      # Loopback only -- the dev credentials are in this file.
      - "127.0.0.1:9000:9000"
      # No web console. The image still passes --console-address :9001, but
      # MinIO's community builds dropped the console in 2025 and nothing
      # listens there -- the 9001 mapping this file had since 18/09 led
      # nowhere (docs/report/assets/phase-6/fresh-machine.txt). To look inside
      # the bucket, use `mc` in this container (infra/README.md).
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      default:
        aliases:
          - minio.localhost
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Nightly pg_dump to a private bucket, and the way back (infra/backup/).
  # Behind a profile: a dev database does not need backing up every night,
  # but this is where the restore drill runs --
  #   docker compose --profile backup run --rm backup backup
  #   docker compose --profile backup run --rm backup restore latest
  # With R2_* empty it writes to the `devpath-backups` bucket of the MinIO
  # above, created private on first use (the media bucket is public).
  backup:
    profiles: ["backup"]
    build: ./backup
    image: devpath-backup:dev
    environment:
      ENV: development
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-devpath}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devpath}
      PGDATABASE: ${POSTGRES_DB:-devpath}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET: ${R2_BUCKET:-devpath-media}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devpath}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devpath-minio}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-devpath-backups}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      target: development
    image: devpath-backend:dev
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-env
    volumes: *backend-volumes
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # urllib rather than curl — the slim image has Python but no HTTP client.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    # Same image as backend; compose reuses the build cache rather than
    # compiling the layers twice.
    build:
      context: ../backend
      target: development
    image: devpath-backend:dev
    # Named queues, not the default one: since grading got a queue of its own,
    # a worker listening to "whatever is there" would listen to neither.
    # `celery` is the default queue and stays here so a task added later
    # without a route has a consumer.
    command:
      ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "media,celery",
       "--loglevel=info"]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy
      # Transcoding reads the original from the bucket and writes HLS back.
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # The clock, and nothing else. It publishes the scheduled jobs in
  # `beat_schedule` onto the queues; the worker above does them.
  #
  # Exactly one replica, always. Two beat processes would enqueue every
  # nightly job twice, and the schedule file below is per-container state, so
  # neither would notice the other.
  beat:
    build:
      context: ../backend
      target: development
    image: devpath-backend:dev
    command:
      ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info",
       "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy
    # No healthcheck: beat answers no `inspect ping` -- it is a publisher, not
    # a worker with a queue to reply on. Its liveness shows up in the worker's
    # log at 03:00, and a missed night is what the cache's 48-hour TTL covers.

  # Submissions, and only submissions. Separate from the worker above because
  # the two jobs are nothing alike -- and because this is the one container in
  # the stack that can talk to the Docker daemon.
  grading-worker:
    build:
      context: ../backend
      target: grading-development
    image: devpath-grading:dev
    command:
      ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "grading",
       "--loglevel=info", "--concurrency=${GRADING_CONCURRENCY:-2}"]
    environment:
      <<: *backend-env
      # The grader is a sibling project, not a dependency: it is mounted and
      # imported rather than installed, the same way its own tests import it.
      PYTHONPATH: /grader
      # The one path that has to mean the same thing here and on the host: the
      # daemon resolves `--mount source=` outside this container, so the
      # directory holding a submission has to exist on both sides under the
      # same name. See the identical entry in `volumes` below.
      DEVPATH_GRADING_WORKSPACE: /var/lib/devpath-grading
    volumes:
      - ../backend:/app
      - /app/.venv
      # Read-only: this container runs the grader, it does not develop it.
      - ../grader:/grader:ro
      # Same path on both sides, deliberately. One submission's source file
      # lives here for the seconds it takes to grade it, and is deleted by the
      # runner afterwards. On Docker Desktop this resolves inside the Linux VM,
      # which is exactly where the daemon looks.
      - /var/lib/devpath-grading:/var/lib/devpath-grading
      # The whole grading design in one line. Everything a submission does is
      # confined to a container with no network, no privileges and a read-only
      # filesystem -- but the process that *starts* those containers needs the
      # daemon, and a socket is not a permission system: this container can
      # start any container it likes on the host. It is why nothing else in
      # this stack gets the socket, why this image has no web server in it,
      # and why no submitted code ever runs in this container.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Ping itself by name rather than "whoever answers": with two workers on
      # one broker, a plain inspect ping is answered by the other one and this
      # container stays healthy while dead.
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app inspect ping -d celery@$$(hostname) > /dev/null
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      target: development
    image: devpath-frontend:dev
    environment:
      # Two URLs on purpose. Server Components resolve the compose hostname;
      # the browser cannot, so anything shipped to the client uses the
      # published host port instead.
      API_BASE_URL_INTERNAL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      # Read by next.config.ts. WATCHPACK_POLLING and CHOKIDAR_USEPOLLING do
      # nothing here -- those belong to webpack, and Next 16 builds with
      # Turbopack, whose watcher is configured through next.config.ts instead.
      WATCH_POLL_INTERVAL_MS: "1000"
    volumes:
      - ../frontend:/app
      # Dependencies and build output stay inside the container: the host copies
      # are Windows builds, and .next churns too much to cross the mount.
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      # 30s, not 10s: every probe renders the page server-side, backend fetch
      # included.
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
