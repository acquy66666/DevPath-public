name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job names its runner image rather than taking ubuntu-latest. The grader
# job asserts what the kernel lets a container do, so a new Ubuntu -- new
# kernel, new cgroup defaults -- can move those results without a line of this
# repo changing. Moving to the next image is a deliberate change, made under
# the sandbox-grading checklist, not something that happens on a date GitHub
# picks.

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    # Auth tests run against a real database inside a rolled-back transaction,
    # so the suite needs Postgres from here on. tests/conftest.py skips the
    # database tests when it cannot connect *and* CI is unset -- in CI it fails
    # instead, so a broken service container can never show up as a green run.
    #
    # Redis is here for the same reason and on the same terms: the rate limiter
    # is tested against a dictionary for its rules and against a real Redis for
    # the four commands it sends. A skipped integration test is a green run
    # that proved nothing.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devpath
          POSTGRES_PASSWORD: devpath
          POSTGRES_DB: devpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpath -d devpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://devpath:devpath@localhost:5432/devpath
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # A dependency added to pyproject.toml but not to the lock would install
      # at whatever version was newest that morning, and nothing would say so:
      # a constraints file only pins what it lists. Re-resolving keeps every
      # pin it can, so any diff means the two files disagree.
      - name: Lock matches pyproject.toml
        run: |
          pip install "uv==$(sed -n 's/^UV_VERSION=//p' scripts/lock.sh)"
          sh scripts/lock.sh
          git diff --exit-code requirements.lock

      - name: Install dependencies
        run: pip install -e ".[dev]" -c requirements.lock

      # What WeasyPrint draws certificates with -- the same packages the
      # backend image installs. The PDF tests skip on a machine without them
      # but fail here, so a missing library cannot turn into a green run.
      - name: System libraries for certificate PDFs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Ruff
        run: |
          ruff check .
          ruff check --config pyproject.toml ../infra/scripts

      # The backup service lives in infra/ but is Python like this, held to the
      # same lint. Its tests need no database: they cover what it decides on
      # its own at night -- what to delete, when to run, where to upload.
      - name: Backup service — ruff and unit tests
        run: |
          ruff check --config pyproject.toml ../infra/backup
          pytest -q -p no:cacheprovider ../infra/backup

      # Same for the host monitor: when a problem is real enough to send, when
      # it is over, and that a message the notifier missed is not lost.
      - name: Host monitor — ruff and unit tests
        run: |
          ruff check --config pyproject.toml ../infra/monitor
          pytest -q -p no:cacheprovider ../infra/monitor

      - name: Migrate the test database
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Plain `node --test` on the TypeScript files, types stripped: no test
      # framework to install for a handful of pure functions. The E2E suite is
      # a separate job once it exists.
      - name: Unit tests
        run: npm test

      # No separate `tsc --noEmit` step. Next generates the global types the
      # app relies on (LayoutProps, PageProps) into .next/types during the
      # build, so type-checking ahead of it fails on a clean checkout -- and
      # type-checking after it would only repeat what the build already did.
      - name: Build
        run: npm run build

  migrations:
    name: Migrations & seed on an empty database
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Same image as compose. Deliberately without infra/postgres/init/, so
        # the migration has to create its own extensions -- exactly the state a
        # fresh VPS database starts in.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devpath
          POSTGRES_PASSWORD: devpath
          POSTGRES_DB: devpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpath -d devpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://devpath:devpath@localhost:5432/devpath

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: pip install -e ".[dev]" -c requirements.lock

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Downgrade to base and back up
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check for un-migrated model changes
        run: alembic check

      # Twice on purpose: the second run proves the script is idempotent,
      # which is what makes it safe to re-run on a database that already has
      # data. A pristine database is also the only place a missing default or
      # a broken constraint shows up.
      - name: Seed, then seed again
        env:
          SEED_ADMIN_PASSWORD: ci-not-a-real-password
        run: |
          python -m scripts.seed
          python -m scripts.seed

      # The interaction seed runs on top of the catalogue seed and has the same
      # promise to keep. It is the one that would hurt most to get wrong: a
      # second run that doubled the enrolments would double every weight in the
      # recommender's matrix, and the evaluation would move for a reason
      # nobody could see in the numbers.
      - name: Seed interactions, then seed them again
        env:
          SEED_LEARNER_PASSWORD: ci-not-a-real-password
        run: |
          python -m scripts.seed_interactions
          python -m scripts.seed_interactions

  grader:
    name: Grader — sandbox image
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: grader

    # The one job that runs code the way a student's submission will run: it
    # builds the sandbox image and then makes assertions from inside a
    # container, because what matters is what the kernel allows, not what the
    # Dockerfile claims. `CI` is set for every GitHub run, and the suite turns
    # a missing Docker daemon into a failure rather than a skip when it is --
    # a silently skipped sandbox test is worse than a red one.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The grader has no dependencies of its own, only tooling -- pinned from
      # the backend's lock so the two jobs lint with the same ruff and a new
      # rule never turns one of them red on its own.
      - name: Install the test tooling
        run: pip install pytest ruff -c ../backend/requirements.lock

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      # The verdict and sandbox-attack suites again, this time through the
      # Docker proxy the worker uses in every stack (grader/proxy) -- so "the
      # runner works behind the proxy" is all of those tests, not a claim --
      # plus the attacks on the proxy itself, against this real daemon. Root
      # in the proxy here only because the runner's temporary directories
      # belong to the runner user, mode 700; in production both are uid 10001.
      - name: Pytest through the Docker proxy
        env:
          DEVPATH_GRADING_WORKSPACE: /tmp/devpath-grading
        run: |
          mkdir -p "$DEVPATH_GRADING_WORKSPACE"
          docker build -t devpath-docker-proxy:ci proxy
          docker run -d --name devpath-docker-proxy --user 0 -p 127.0.0.1:2375:2375 \
            -e DEVPATH_GRADING_WORKSPACE \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$DEVPATH_GRADING_WORKSPACE:$DEVPATH_GRADING_WORKSPACE:ro" \
            devpath-docker-proxy:ci
          for _ in $(seq 1 30); do
            docker exec devpath-docker-proxy python -m proxy.server health && break
            sleep 1
          done
          DOCKER_HOST=tcp://127.0.0.1:2375 DEVPATH_THROUGH_PROXY=1 \
          DEVPATH_REAL_DOCKER_HOST=unix:///var/run/docker.sock \
            pytest -q -rs tests/test_verdict_end_to_end.py tests/test_sandbox_attacks.py \
              tests/test_runner_core.py tests/test_docker_proxy_live.py

      - name: Docker proxy log
        if: always()
        run: docker logs devpath-docker-proxy 2>&1 | tail -80 || true

  deploy-config:
    name: Deploy config — compose, nginx, production images
    runs-on: ubuntu-24.04

    # The VPS is the one thing CI cannot stand in for, so it checks everything
    # that comes before it: that the compose file merges, that nginx accepts
    # the config with a certificate in place, and that both production images
    # actually build. A broken Dockerfile found here costs a minute; found on
    # the server it costs the deploy.
    steps:
      - uses: actions/checkout@v7

      - name: Fill in the secrets compose refuses to start without
        working-directory: infra
        run: |
          sed -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-not-a-real-password/' \
              -e 's/^JWT_SECRET=$/JWT_SECRET=ci-not-a-real-secret-only-long-enough-for-hs256/' \
              .env.prod.example > .env.prod

      - name: Compose file is valid
        working-directory: infra
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod config -q

      # The two mistakes worth failing the build over: a database port left
      # published to the internet, and a source bind mount left in, which would
      # make the running code something other than the code that was built.
      - name: Only nginx publishes ports, and nothing is bind-mounted
        working-directory: infra
        run: |
          rendered="$(docker compose -f docker-compose.prod.yml --env-file .env.prod config)"

          published="$(printf '%s' "$rendered" | grep -c 'published:' || true)"
          if [ "$published" -ne 2 ]; then
            echo "Expected exactly two published ports (80 and 443), found $published:" >&2
            printf '%s' "$rendered" | grep -n -B 8 'published:' >&2
            exit 1
          fi

          if printf '%s' "$rendered" | grep -qE 'source: .*/(backend|frontend)$'; then
            echo "A source tree is bind-mounted into a production container." >&2
            exit 1
          fi

      # The socket is root on the host. One service may hold it, the proxy
      # that filters it for the grading worker -- a second holder, or the
      # worker getting it back, would undo grader/proxy entirely.
      - name: Only the Docker proxy holds the socket
        working-directory: infra
        run: |
          for file in docker-compose.yml docker-compose.prod.yml; do
            docker compose -f "$file" --env-file .env.prod config --format json > "rendered-$file.json"
            python3 - "rendered-$file.json" "$file" <<'EOF'
          import json, sys
          services = json.load(open(sys.argv[1]))["services"]
          holders = sorted(
              name for name, spec in services.items()
              if any("docker.sock" in str(v.get("source", "")) for v in spec.get("volumes", []))
          )
          if holders != ["docker-proxy"]:
              sys.exit(f"{sys.argv[2]}: the socket is held by {holders}, expected only docker-proxy")
          print(f"{sys.argv[2]}: only docker-proxy holds the socket.")
          EOF
          done

      # Docker keeps a container's log without limit unless told otherwise, and
      # a service added later would not inherit the anchor by itself.
      - name: Every service's log is rotated
        working-directory: infra
        run: |
          docker compose -f docker-compose.prod.yml config --no-interpolate --format json > rendered.json
          python3 - rendered.json <<'EOF'
          import json, sys
          services = json.load(open(sys.argv[1]))["services"]
          bare = [n for n, s in services.items() if not s.get("logging", {}).get("options", {}).get("max-size")]
          if bare:
              sys.exit("No log rotation on: " + ", ".join(sorted(bare)))
          print(f"{len(services)} services, every one rotated.")
          EOF

      # The examples are the documentation of every switch, and production
      # silently lacking one the dev stack has is how VNPay would have
      # answered 503 on the VPS. See the script's docstring for the checks.
      - name: Env examples match the code
        run: python3 infra/scripts/check_env_examples.py

      - name: Shell scripts
        run: shellcheck infra/scripts/*.sh infra/loadtest/*.sh backend/scripts/*.sh

      # Runs the image's own entrypoint, so envsubst fills the template exactly
      # as it will on the server. The self-signed certificate mirrors what
      # init-tls.sh puts there first -- without one nginx cannot load the config
      # at all, which is the chicken-and-egg that script exists to break.
      - name: nginx accepts the rendered config
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
            -e DOMAIN=devpath.example.com \
            -e NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 \
            --entrypoint sh nginx:1.27-alpine -c '
              set -e
              apk add --no-cache openssl >/dev/null
              mkdir -p /etc/letsencrypt/live/devpath.example.com
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout /etc/letsencrypt/live/devpath.example.com/privkey.pem \
                -out /etc/letsencrypt/live/devpath.example.com/fullchain.pem \
                -subj /CN=devpath.example.com 2>/dev/null
              /docker-entrypoint.sh nginx -t
              # The assistant streams only while nginx obeys the backend
              # X-Accel-Buffering: no -- ignoring it was measured to turn every
              # answer into one burst (phase-6/sse-through-nginx.txt).
              if nginx -T 2>/dev/null | grep -qiE "proxy_ignore_headers[^;]*x-accel-buffering"; then
                echo "nginx ignores X-Accel-Buffering: the chat answers would stop streaming" >&2
                exit 1
              fi
            '

      # The real installer on a real systemd: the runner has both, and no
      # stack is up, so the first round must run, find every service missing,
      # and still finish cleanly -- a failed unit means the monitor broke, not
      # the site.
      - name: Host monitor installs and runs under systemd
        run: |
          sudo MONITOR_USER="$USER" ./infra/scripts/install-monitor.sh
          sudo systemd-analyze verify /etc/systemd/system/devpath-monitor.service /etc/systemd/system/devpath-monitor.timer
          systemctl is-active --quiet devpath-monitor.timer
          sudo python3 - <<'EOF'
          import json
          state = json.load(open("/var/lib/devpath-monitor/state.json"))
          missing = {k: v for k, v in state["problems"].items() if v["detail"] == "không có container"}
          assert "service:backend" in missing and "service:nginx" in missing, state["problems"]
          assert "site" in state["problems"], state["problems"]
          print(f"{len(state['problems'])} problems found with no stack running, as expected.")
          EOF
          sudo ./infra/scripts/install-monitor.sh --remove
          test ! -e /etc/systemd/system/devpath-monitor.timer

      - name: Backend production image builds
        run: docker build --target production -t devpath-backend:ci backend

      # Built from the database's own image, so its pg_dump is the server's
      # version. Run once to prove the script works on that image's Python
      # (Debian's 3.11, not the 3.12 its tests ran on), and that production
      # with nowhere to put backups is refused rather than guessed.
      - name: Backup image builds and refuses to guess
        run: |
          docker build -t devpath-backup:ci infra/backup
          docker run --rm devpath-backup:ci --help > /dev/null
          if docker run --rm -e ENV=production -e PGDATABASE=devpath devpath-backup:ci list; then
            echo "Production without backup storage was not refused." >&2
            exit 1
          fi

      # No API URL argument: the production image is served behind nginx and
      # calls /api on its own origin, so it is built without a domain.
      # Building it the way production does is the point of this step.
      - name: Frontend production image builds
        run: docker build --target production -t devpath-frontend:ci frontend

      # The standalone server has to be in the image and has to start. It
      # cannot render a page without the API, so answering at all is the test.
      - name: Frontend image starts and serves
        run: |
          docker run -d --name devpath-fe -p 3000:3000 devpath-frontend:ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/dang-nhap; then
              echo "Next is serving."
              docker rm -f devpath-fe >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Next did not answer within 60s:" >&2
          docker logs devpath-fe >&2
          exit 1

  e2e:
    name: E2E — golden flow on the whole stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The same compose stack a developer runs, brought up from nothing: the
    # golden flow needs the API, Postgres, Redis, the bucket, the worker that
    # grades in a Docker sandbox and the one that draws certificates, all at
    # once. Playwright then drives a real Chromium through the UI.
    #
    # VNPay credentials are made-up values: the browser is stood in for at
    # the bank's page, and the IPN is signed inside the backend container by
    # scripts.simulate_vnpay_ipn with the same secret the backend checks.
    env:
      VNPAY_TMN_CODE: CIDEMO01
      VNPAY_HASH_SECRET: ci-not-a-real-vnpay-secret

    steps:
      - uses: actions/checkout@v7

      # Before the stack, not after: the frontend container mounts an
      # anonymous volume at /app/node_modules inside the bind-mounted
      # frontend/, and Docker creates that mountpoint on the host as root --
      # an `npm ci` after `compose up` cannot write there (EACCES). Made
      # first, the folder is the runner's and the volume merely covers it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The grader starts submissions with `--pull never`: the image has to be
      # on this host before the first one arrives.
      - name: Sandbox image
        run: docker build -t devpath-sandbox-python:v1 grader/images/python

      - name: Start the stack
        working-directory: infra
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Migrate and seed
        working-directory: infra
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend python -m scripts.seed

      - name: Golden flow
        working-directory: frontend
        run: npm run test:e2e

      - name: Stack logs
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color --tail 200 backend worker grading-worker frontend

      - name: Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
