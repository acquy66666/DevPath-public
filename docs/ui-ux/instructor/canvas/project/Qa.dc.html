<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hỏi đáp của học viên</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#066254}a:hover{color:#074b40}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 1100px; background: #f8fafc; font-family: 'Lexend', 'Segoe UI', system-ui, sans-serif; color: #102029; display: flex; flex-direction: column">
  <header style="box-sizing: border-box; height: 64px; border-bottom: 1px solid #e3eaee; background: #ffffff; display: flex; align-items: center; padding: 0 32px; gap: 28px">
    <a href="#" style="font-size: 20px; font-weight: 700; text-decoration: none; color: #102029">Dev<span style="color: #007967">Path</span></a>
    <nav style="display: flex; gap: 20px; font-size: 15px"><a href="#" style="text-decoration: none; color: #3e505a">Khóa học</a><a href="#" style="text-decoration: none; color: #3e505a">Bảng xếp hạng</a></nav>
    <span style="flex: 1"></span>
    <span style="width: 36px; height: 36px; border-radius: 18px; background: #ccf5ea; color: #074b40; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">K</span>
  </header>
  <div style="border-bottom: 1px solid #e3eaee; background: #ffffff">
    <div style="box-sizing: border-box; max-width: 1152px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 24px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #556670">Giảng dạy</span>
      <nav aria-label="Khu giảng viên" style="display: flex; gap: 4px; flex: 1">
        <a href="Main.dc.html" style="box-sizing: border-box; height: 52px; padding: 0 12px; display: inline-flex; align-items: center; font-size: 15px; color: #3e505a; text-decoration: none; border-bottom: 2px solid transparent">Khóa học</a>
        <a href="#" aria-current="page" style="box-sizing: border-box; height: 52px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #102029; text-decoration: none; border-bottom: 2px solid #007967">Hỏi đáp<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #007967; color: #ffffff; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">3</span></a>
        <a href="#" style="box-sizing: border-box; height: 52px; padding: 0 12px; display: inline-flex; align-items: center; font-size: 15px; color: #3e505a; text-decoration: none; border-bottom: 2px solid transparent">Thống kê</a>
        <a href="#" style="box-sizing: border-box; height: 52px; padding: 0 12px; display: inline-flex; align-items: center; font-size: 15px; color: #3e505a; text-decoration: none; border-bottom: 2px solid transparent">Cấp bậc</a>
      </nav>
      <a href="States.dc.html" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #d2dbe0; background: #ffffff; color: #102029; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; box-sizing: border-box">+ Tạo khóa học</a>
    </div>
  </div>

  <main style="box-sizing: border-box; width: 100%; max-width: 848px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px">
    <div>
      <h1 style="margin: 0; font-size: 30px; line-height: 38px; font-weight: 700">Hỏi đáp của học viên</h1>
      <p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: #3e505a">Câu trả lời của bạn mang nhãn “Giảng viên” và người hỏi nhận được thông báo.</p>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #e3eaee">
      <div role="tablist" aria-label="Lọc câu hỏi" style="display: flex; gap: 4px">
        <button role="tab" aria-selected="true" type="button" style="height: 44px; padding: 0 14px; border: 0; border-bottom: 2px solid #007967; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #102029">Chờ trả lời · 3</button>
        <button role="tab" aria-selected="false" type="button" style="height: 44px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; font: inherit; font-size: 15px; color: #3e505a">Tất cả</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding-bottom: 6px">
        <label for="qc" style="font-size: 14px; color: #3e505a">Khóa học</label>
        <select id="qc" style="box-sizing: border-box; height: 36px; border: 1px solid #6f7e88; border-radius: 10px; padding: 0 10px; font: inherit; font-size: 15px; background: #ffffff; max-width: 280px"><option>Tất cả khóa học</option></select>
      </div>
    </div>

    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{threads}}" as="t" hint-placeholder-count="3">
        <li>
          <button type="button" style="box-sizing: border-box; width: 100%; text-align: left; font: inherit; color: inherit; border: 1px solid #e3eaee; border-radius: 14px; background: #ffffff; padding: 16px; display: flex; gap: 16px; align-items: flex-start">
            <span style="width: 48px; flex: none; border-radius: 10px; background: #f0f4f7; color: #556670; padding: 6px 0; display: flex; flex-direction: column; align-items: center; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 18v-6H5l7-7 7 7h-4v6H9z"/></svg>{{t.votes}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 13px; color: #556670">{{t.place}}</span>
              <span style="font-size: 17px; line-height: 24px; font-weight: 600">{{t.title}}</span>
              <span style="font-size: 14px; line-height: 20px; color: #556670">{{t.body}}</span>
              <span style="display: flex; gap: 12px; align-items: center; font-size: 13px; color: #556670"><span>{{t.who}}</span><span style="flex: 1"></span><span>{{t.replies}}</span></span>
            </span>
          </button>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      threads: [
        { votes: 4, place: 'Python cơ bản cho người mới bắt đầu · Ép kiểu và những cái bẫy quen thuộc', title: 'Vì sao int("12.5") báo lỗi mà int(12.5) thì không?', body: 'Em tưởng hai cái giống nhau, chỉ khác là một bên là chuỗi…', who: 'Người mua 08 · 2 giờ trước', replies: '1 trả lời' },
        { votes: 1, place: 'Cấu trúc dữ liệu & giải thuật với Python · Danh sách liên kết', title: 'Xóa nút đầu của danh sách liên kết thì head trỏ vào đâu?', body: 'Trong video thầy gán head = head.next, nhưng nút cũ có bị xóa khỏi bộ nhớ không ạ?', who: 'Người mua 21 · hôm qua', replies: 'Chưa có trả lời' },
        { votes: 0, place: 'Python cơ bản cho người mới bắt đầu · Bài tập: đếm số chẵn', title: 'Code chạy đúng trên máy nhưng nộp bị “Quá thời gian”', body: 'Em dùng vòng lặp for tới n, với n = 999999 thì máy em chạy 1 giây…', who: 'Người mua 13 · 3 ngày trước', replies: 'Chưa có trả lời' }
      ]
    };
  }
}
</script>
</body>
</html>
