# Production stack for the VPS.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# A separate file rather than an override of docker-compose.yml. An override
# can add to a list but never remove from one, and the two things that must be
# gone in production -- the published Postgres/Redis ports and the source bind
# mounts -- are exactly the entries an override cannot take away.
#
# What changes from development, and why:
#
#   * only nginx publishes ports. Postgres, Redis, the API and Next are
#     reachable on the compose network and nowhere else, so the firewall has
#     two ports to think about instead of six.
#   * every service restarts unless it was stopped on purpose, so a reboot of
#     the VPS brings the site back without anybody logging in.
#   * images are built from the `production` target: no reloader, no test
#     tooling, and Next served from a standalone build rather than `next dev`.
#   * no bind mounts. What is running is what was built, which is the only way
#     a rollback means anything.
name: devpath

x-backend-env: &backend-env
  ENV: production
  DEBUG: "false"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  # No default: the app refuses to start in production with the dev secret, and
  # compose refuses to start without this set at all.
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: https://${DOMAIN:?set DOMAIN in .env.prod}/api/v1/auth/google/callback
  FRONTEND_URL: https://${DOMAIN}
  # How often one student may ask for grading. Enforced by the API before a
  # row is written or a job queued; see backend/app/services/rate_limit.py.
  SUBMISSION_COOLDOWN_SECONDS: ${SUBMISSION_COOLDOWN_SECONDS:-10}
  SUBMISSION_HOURLY_LIMIT: ${SUBMISSION_HOURLY_LIMIT:-40}
  # Object storage. By default the `storage` service below (RustFS), reached
  # as https://${DOMAIN}/devpath-media through nginx -- the address the
  # browser uses too, so a presigned URL is signed for the host it is used on.
  # Inside this network ${DOMAIN} is an alias of nginx (see nginx below), so
  # the API and the workers take the same path with no extra name and no code
  # that knows. Decision and measurements:
  # docs/report/assets/phase-6/storage-decision.txt.
  #
  # Cloudflare R2 instead: set every R2_* in .env.prod, endpoint and public URL
  # included (docs/huong-dan-cloudflare-r2.md). The storage service then sits
  # idle; nothing else changes.
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env.prod}}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env.prod}}
  # The self-hosted bucket is always devpath-media: nginx routes that path and
  # no other. R2_BUCKET is for an R2 bucket of another name.
  R2_BUCKET: ${R2_BUCKET:-devpath-media}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://${DOMAIN}/devpath-media}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-https://${DOMAIN}}
  # Gemini. Empty by default: the ingest job and the chat endpoints say
  # "chưa cấu hình" rather than failing. Put a real key in infra/.env.prod --
  # this file runs with --env-file .env.prod, so infra/.env is never read.
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
  GEMINI_CHAT_THINKING_LEVEL: ${GEMINI_CHAT_THINKING_LEVEL:-minimal}
  # One origin, and it is the site's own. The browser calls /api on the same
  # host it loaded the page from, so this only ever matters if something else
  # is pointed at this API on purpose.
  CORS_ORIGINS: https://${DOMAIN}
  # VNPay. Missing from this file until 02/10/2026, so on the VPS the payment
  # endpoint would have answered 503 whatever .env.prod said, and the return
  # URL fallen back to localhost (docs/report/assets/phase-6/fresh-machine.txt).
  # Empty keys still mean "chưa cấu hình" and the rest of the site runs. The
  # return URL is built from DOMAIN, like Google's redirect URI above; the IPN
  # URL to give VNPay is https://<DOMAIN>/api/v1/payments/vnpay/ipn.
  VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
  VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
  VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  VNPAY_RETURN_URL: https://${DOMAIN}/thanh-toan/ket-qua

# Every container's output, rotated. Docker's default json-file driver keeps a
# container's log for as long as the container exists, with no limit -- one
# chatty worker on a 40 GB disk is an outage of its own. Five files of 10 MB
# per container, the older ones compressed, is days of history at this
# traffic and a ceiling of ~600 MB across the stack.
#
# One place to read it all: `docker compose ... logs -t --since 1h`, or one
# service by name. A container replaced by a deploy takes its log with it,
# so look before redeploying (docs/huong-dan-deploy-vps.md, mục 4b).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  # A pg_dump every night at BACKUP_HOUR (Vietnam time) to a private bucket,
  # keeping the newest BACKUP_KEEP. Built from the database's own image so the
  # dump tools are the server's version (infra/backup/Dockerfile). Started
  # after a missed night -- the server was off at the hour -- it backs up at
  # once rather than waiting for the next one.
  #
  # Unhealthy when the last good backup is more than 26 hours old, so
  # `docker compose ps` and deploy.sh both see a backup that stopped. The one
  # way to run without backups is to say so: BACKUP_ENABLED=false.
  #
  # Restoring: infra/scripts/restore-db.sh (docs/huong-dan-deploy-vps.md).
  backup:
    build: ./backup
    image: devpath-backup:prod
    restart: unless-stopped
    logging: *logging
    environment:
      ENV: production
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET: ${R2_BUCKET:-devpath-media}
      # Credentials of its own, scoped to the backup bucket, are better than
      # the app's: a leaked app key then cannot delete the backups as well.
      BACKUP_ENDPOINT_URL: ${BACKUP_ENDPOINT_URL:-}
      BACKUP_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:-}
      BACKUP_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-devpath-backups}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "/usr/local/lib/devpath-backup/devpath_backup.py", "health"]
      interval: 5m
      timeout: 10s
      retries: 1
      # Room for the catch-up backup a fresh start runs before it is healthy.
      start_period: 10m
      start_interval: 10s

  # Media: videos, avatars, banners, transcripts, certificate PDFs. RustFS,
  # an S3 server, on this machine -- R2 wants a payment card and the plan
  # stays at zero cost. No ports: the internet reaches it only through nginx,
  # which routes /devpath-media and nothing else of its API.
  #
  # Not backed up: the backup service dumps the database, off this machine.
  # Seed content can be loaded again; uploads made on the server cannot.
  #
  # A version and a digest, not :latest -- RustFS reached 1.0 on 16/09/2026
  # and releases often. SeaweedFS passed the same tests and is the fallback
  # (docs/report/assets/phase-6/storage-decision.txt).
  storage:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env.prod}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env.prod}
      RUSTFS_CONSOLE_ENABLE: "false"
      # To stdout, where the rotation above applies. The image's default is
      # files under /logs inside the container, which nothing rotates.
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
      RUSTFS_OBS_USE_STDOUT: "true"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Creates the media bucket and lets anonymous visitors read its objects --
  # not list them, not write -- then exits. On every `up`, so a changed rule
  # takes effect on the next deploy. No CORS: the page and the bucket share an
  # origin. backend/scripts/init_storage.py.
  storage-init:
    build:
      context: ../backend
      target: production
    image: devpath-backend:prod
    command: ["python", "-m", "scripts.init_storage"]
    restart: "no"
    logging: *logging
    environment:
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: devpath-media
      STORAGE_CORS_ORIGINS: ""
    depends_on:
      storage:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      target: production
    image: devpath-backend:prod
    restart: unless-stopped
    logging: *logging
    # Two workers on a small VPS: enough that one slow request does not block
    # the health check, few enough to leave room for Postgres and the worker.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${UVICORN_WORKERS:-2}"
      # Behind nginx, so the client address arrives in X-Forwarded-For.
      # Trusting every proxy is safe only because nginx is the one thing that
      # can reach this port and it overwrites the header instead of appending
      # to it (nginx/snippets/proxy.conf) -- the sign-in limits count per
      # client address, and an appended header would let a client pick its own.
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../backend
      target: production
    image: devpath-backend:prod
    restart: unless-stopped
    logging: *logging
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=info
      # One transcode at a time: ffmpeg will use whatever CPU it is given, and
      # two of them on a small VPS starve the API instead of finishing sooner.
      - --concurrency=${CELERY_CONCURRENCY:-1}
      # Named queues, not the default one: grading has a queue of its own and
      # its own worker below.
      - -Q
      - media,celery
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Transcoding reads the original from the bucket and writes HLS back.
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # The clock. One replica, always: two would enqueue every nightly job twice.
  beat:
    build:
      context: ../backend
      target: production
    image: devpath-backend:prod
    restart: unless-stopped
    logging: *logging
    command:
      - celery
      - -A
      - app.workers.celery_app
      - beat
      - --loglevel=info
      # /tmp, because the schedule file is written on every tick and the
      # working directory in the production image is not a place to keep state.
      - --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Hands the grading workspace to the worker's uid, then exits.
  #
  # The daemon creates a missing bind-mount source as root:root 755, and the
  # worker runs as uid 10001 -- so on a fresh host every submission ended in a
  # system error, the worker unable to make its temporary directory. Nothing
  # in development showed it: the dev worker runs as root. Found by the
  # Phase 6 load test, the first time the production worker graded anything
  # (docs/report/assets/phase-6/load-test.md).
  #
  # 700, because the only reader is the worker: a sandbox sees its own `code/`
  # directory and nothing above it, and the daemon is root. Done here rather
  # than as a step in the runbook, so a fresh server cannot skip it -- and on
  # every `up`, so a directory recreated by hand is put right again.
  grading-workspace:
    build:
      context: ../backend
      target: production
    image: devpath-backend:prod
    user: "0"
    restart: "no"
    logging: *logging
    entrypoint:
      - sh
      - -c
      - chown 10001:10001 /var/lib/devpath-grading && chmod 700 /var/lib/devpath-grading
    volumes:
      - /var/lib/devpath-grading:/var/lib/devpath-grading

  # Starts a sandbox container for every test case -- through docker-proxy
  # below, not the socket. Until 02/10/2026 it held /var/run/docker.sock
  # itself, and a socket is not a permission system: one request
  # (`docker run --privileged -v /:/host`) and this container was root on the
  # host. Now a compromised worker can create sandboxes that obey every
  # grading invariant and operate on containers labelled as grading runs, and
  # nothing else. It still never executes submitted code itself -- every line
  # of that runs in the throwaway container, with no network, no privileges
  # and a read-only filesystem.
  #
  # Before the first submission, build the sandbox image on this host:
  #     docker build -t devpath-sandbox-python:v1 grader/images/python
  # The runner starts containers with `--pull never`, so a missing image is a
  # loud system error rather than a silent download.
  grading-worker:
    build:
      context: ../backend
      target: grading-production
    image: devpath-grading:prod
    restart: unless-stopped
    logging: *logging
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - -Q
      - grading
      - --loglevel=info
      # How many submissions are graded at once, and the number to change when
      # the VPS changes. Each one holds a container with half a core and
      # 256 MB, so two is the ceiling on the 2 vCPU / 4 GB box this is sized
      # for -- with the other half core left for Postgres, Redis and the API.
      - --concurrency=${GRADING_CONCURRENCY:-2}
    environment:
      <<: *backend-env
      PYTHONPATH: /grader
      # Has to name the same directory here and on the host: the daemon
      # resolves the sandbox's bind mount outside this container. See volumes.
      DEVPATH_GRADING_WORKSPACE: /var/lib/devpath-grading
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      # The grader is a sibling project, mounted rather than installed -- the
      # same way its own tests import it. Read-only: this container runs it.
      - ../grader:/grader:ro
      # Same path on both sides. A submission's source file lives here for the
      # seconds it takes to grade, and the runner deletes it afterwards.
      - /var/lib/devpath-grading:/var/lib/devpath-grading
    networks:
      - default
      - grading-docker
    depends_on:
      docker-proxy:
        condition: service_healthy
      grading-workspace:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Itself by name: with two workers on one broker, a plain inspect ping is
      # answered by the other one and this container stays healthy while dead.
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app inspect ping -d celery@$$(hostname) > /dev/null
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # The one container on this host that holds the Docker socket, and the only
  # thing it does is decide what the grading worker may ask of the daemon:
  # create a sandbox that obeys every grading invariant (allowed image, no
  # network, read-only root, no capabilities, limits, one read-only mount of a
  # submission directory), and attach / start / wait / kill / inspect / remove
  # containers labelled as grading runs. Everything else -- exec, image pulls,
  # networks, volumes, privileged or host-mounted containers -- is a 403.
  # Rules: grader/proxy/policy.py; why it reads bodies: grader/proxy/server.py.
  #
  # Reachable only on `grading-docker`, an internal network it shares with
  # the grading worker and nothing else; no ports published.
  docker-proxy:
    build: ../grader/proxy
    image: devpath-docker-proxy:prod
    restart: unless-stopped
    logging: *logging
    # uid 10001, like the worker whose workspace it reads; the host's docker
    # group (`getent group docker | cut -d: -f3`) is what opens the socket.
    user: "10001:10001"
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      DEVPATH_GRADING_WORKSPACE: /var/lib/devpath-grading
      DOCKER_PROXY_IMAGES: devpath-sandbox-python:v1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: to check a mount source is a real submission directory,
      # not a link the worker planted to somewhere else on the host.
      - /var/lib/devpath-grading:/var/lib/devpath-grading:ro
    networks:
      - grading-docker
    depends_on:
      grading-workspace:
        condition: service_completed_successfully
    healthcheck:
      # A ping through the proxy itself: green means proxy and daemon both.
      test: ["CMD", "python", "-m", "proxy.server", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      target: production
      args:
        # No API URL on purpose: empty means "same origin as the page", and
        # nginx routes /api to the backend on that origin. So the browser never
        # makes a cross-site request, the refresh cookie is not third-party,
        # and -- because NEXT_PUBLIC_* is inlined at build time -- the browser
        # bundle carries no domain.
        #
        # These two do have to be right at build time, and a rebuild is the
        # only way to change them (deploy.sh rebuilds on every run). The site
        # URL is what canonical and Open Graph URLs are resolved against; the
        # image refuses to build without it rather than fall back to localhost.
        NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    image: devpath-frontend:prod
    restart: unless-stopped
    logging: *logging
    environment:
      # Server Components stay inside the compose network; only the browser
      # goes out through nginx.
      API_BASE_URL_INTERNAL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    # The image's own entrypoint, with a loop beside it that reloads nginx
    # every 6 hours. certbot renews the certificate files on disk, but nginx
    # reads them only when it (re)loads -- so before this, a renewed
    # certificate sat unused until somebody happened to redeploy, and the one
    # in memory expired under it 90 days after the first. Found while writing
    # the monitor's certificate check (docs/report/assets/phase-6/monitoring.txt).
    # A reload is graceful: open connections finish on the old workers.
    entrypoint:
      - /bin/sh
      - -c
      - |
        (while :; do sleep 6h; nginx -s reload; done) &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The image's entrypoint runs envsubst over /etc/nginx/templates/*.template
      # and writes the result into conf.d. It substitutes only names that are
      # actually exported, so nginx's own $host and $remote_addr survive.
      DOMAIN: ${DOMAIN}
      # Opt-in: the image's 15-local-resolvers script returns early unless this
      # is set, and without it ${NGINX_LOCAL_RESOLVERS} reaches the config
      # unsubstituted and nginx dies on a resolver it cannot parse.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      default:
        aliases:
          # So that, inside this network, https://${DOMAIN} is this nginx: the
          # API and the workers reach the bucket by the very URL they sign
          # for the browser (R2_ENDPOINT_URL above). Without it the name
          # resolves to the server's public address, and whether a container
          # can reach its own host that way depends on the cloud's NAT.
          - ${DOMAIN}
    # No depends_on: the upstreams are resolved per request, not at config
    # load, so nginx comes up on its own and answers 502 until they arrive.
    # That is what lets scripts/init-tls.sh get a certificate on a fresh
    # server before the application images have even been built.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Wakes up twice a day, renews anything inside 30 days of expiry, and does
  # nothing the rest of the time. nginx picks a new certificate up on reload,
  # which its own entrypoint loop does every 6 hours (see nginx above); the
  # host monitor checks the certificate actually being served.
  #
  # A version, not :latest -- a certbot that changed its CLI would only be
  # noticed when a renewal failed, weeks after the pull that brought it in.
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    logging: *logging
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >-
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

networks:
  # The grading worker and the Docker proxy, nobody else. Internal: no route
  # out, and the proxy's port is reachable from exactly one container.
  grading-docker:
    internal: true

volumes:
  postgres_data:
