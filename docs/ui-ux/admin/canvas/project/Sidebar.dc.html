<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","queue","reports","users","coupons","banner"],"default":"queue"},"$preview":{"width":248,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'queue';
const base = 'height: 40px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 15px; text-decoration: none; ';
const on = base + 'font-weight: 600; color: #074b40; background: #e7fbf6';
const off = base + 'color: #3e505a';
const keys = ['overview', 'queue', 'reports', 'users', 'coupons', 'banner'];
const s = { other: off };
const c = {};
keys.forEach((k) => { s[k] = k === active ? on : off; c[k] = k === active ? 'page' : 'false'; });
return { s, c };
}
}
</script>
