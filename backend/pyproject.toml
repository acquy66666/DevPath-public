[project]
name = "devpath-backend"
version = "0.1.0"
description = "DevPath e-learning platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # The `vector` column type, so SQLAlchemy and Alembic can say what the
    # pgvector extension already understands. The extension itself lives in
    # the database (see the first migration); this is only the client side.
    "pgvector>=0.3.6",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "bcrypt>=4.2",
    # [crypto] pulls in `cryptography`: without it PyJWT cannot verify the
    # RS256 signature on Google's id_token and Google sign-in fails at runtime.
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    # R2 speaks the S3 API. Presigning is pure local computation (HMAC over
    # a canonical request), so the sync client is fine inside async routes;
    # the Celery worker uses the same client for real transfers.
    "boto3>=1.35",
    # Certificates: HTML and CSS laid out into a PDF. Needs Pango from the
    # system (see the Dockerfile and CI) -- which is why it is imported only
    # where a PDF is actually drawn, and a Windows laptop without it can still
    # run everything else.
    "weasyprint>=66",
    # The QR code on a certificate, drawn as SVG straight into the page.
    # Pure Python, no Pillow.
    "segno>=1.6",
    # Every statistics page exports to Excel. Written on the server, from the
    # same queries the page reads, so a sheet cannot show a number the screen
    # would not -- and an instructor's export cannot carry a column the admin
    # one has. Pure Python.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated DDL: one column per line, however long that line comes out.
# Only the formatting rule is waived -- F, B and UP still apply.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
# Without this, the local alembic/ directory makes ruff treat the alembic
# package as first-party and reorder its import.
known-third-party = ["alembic"]
