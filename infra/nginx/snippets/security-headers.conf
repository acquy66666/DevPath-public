# Headers sent with every HTTPS response.
#
# `always` on each one: without it nginx omits the header on error responses,
# and a 404 or a 502 is exactly where a browser should still be told the rules.
#
# Included at server level *and* in every location that has an add_header of
# its own: nginx inherits add_header from the enclosing level only when the
# inner level has none, so one Cache-Control line in a location silently drops
# everything below.

# Two years, subdomains included. Only ever add `preload` once the site has run
# on HTTPS long enough to be sure -- getting off the preload list takes months.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Stop the browser guessing a content type that the server did not send.
add_header X-Content-Type-Options "nosniff" always;

# No framing at all: nothing here is meant to be embedded, and clickjacking a
# course page into an invisible iframe is how a one-click enrolment gets used.
# The policy below says the same with frame-ancestors; this is for browsers
# older than that.
add_header X-Frame-Options "DENY" always;

# Send the full URL only to ourselves; a cross-origin request sees the origin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing on this site asks for any of them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# A window this site opens, or one that opened it, gets no handle on the other.
# Safe because nothing here uses a popup: Google sign-in and VNPay are both
# full-page redirects.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Enforced since 18/10/2026, after Report-Only from 01/10: Chrome ran the
# golden flow and every role's pages against the production build on the real
# domain, and the site itself broke none of it -- the dev server (`next dev`
# evaluates code at runtime) cannot show that. Measured with
# docs/report/assets/phase-6/csp-enforce/csp-probe.cjs, which is what to run
# again before shipping anything that loads code, styles, fonts or media from
# somewhere new (an animation library in Phase 7, say) -- with the golden-flow
# E2E pointed at the production stack, which fails on any violation too.
#
#   script-src  'unsafe-inline': Next inlines its bootstrap. No outside script
#               host at all -- Monaco is served from /monaco, fonts from
#               /fonts. That includes Cloudflare's analytics beacon
#               (static.cloudflareinsights.com), which Cloudflare injects
#               into pages it proxies unless RUM is switched off for the
#               zone: it is not part of this site, and the privacy policy
#               page does not promise visitors any such measurement.
#   img/media   https: and blob:: avatars, thumbnails and HLS segments come from
#               the bucket's public host, and hls.js feeds the player from blob:.
#   connect-src https:: uploads PUT straight to a presigned bucket URL, whose
#               host depends on the deployment. 'self' covers /api and the
#               grading WebSocket.
#   worker-src  blob:: Monaco and hls.js start their workers that way.
#   object-src  'none': the certificate PDF still opens in Chrome's viewer --
#               measured, the viewer is not an <object> of the page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
