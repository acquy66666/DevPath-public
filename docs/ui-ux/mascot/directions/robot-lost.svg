  </g>
  <rect id="body" x="66" y="120" width="68" height="52" rx="16" fill="#039580" stroke="#05332b" stroke-width="4.5"/>
  <g id="map">
    <path d="M58 128 L86 133 L114 128 L142 133 L142 172 L114 167 L86 172 L58 167 Z" fill="#ffffff" stroke="#05332b" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M86 133 L86 172 M114 128 L114 167" stroke="#b4c0c7" stroke-width="2" fill="none"/>
    <path d="M70 162 C80 152 90 162 100 152 C106 146 112 152 118 146" stroke="#039580" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" fill="none"/>
    <path d="M118 134 L126 142 M126 134 L118 142" stroke="#e24947" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="0" transform="translate(100 138) rotate(180)" font-family="Lexend, system-ui, sans-serif" font-size="7" font-weight="700" fill="#556670" text-anchor="middle">BẢN ĐỒ</text>
  </g>
  <g id="arms" fill="none" stroke-linecap="round">
    <path d="M68 134 C62 138 58 142 56 146" stroke="#05332b" stroke-width="15"/>
    <path d="M132 134 C138 138 142 142 144 146" stroke="#05332b" stroke-width="15"/>
    <path d="M68 134 C62 138 58 142 56 146" stroke="#039580" stroke-width="7"/>
    <path d="M132 134 C138 138 142 142 144 146" stroke="#039580" stroke-width="7"/>
  </g>
  <g id="hands" fill="#ccf5ea" stroke="#05332b" stroke-width="3.5">
    <circle cx="56" cy="150" r="8"/>
    <circle cx="144" cy="150" r="8"/>
  </g>
  <g id="head">
