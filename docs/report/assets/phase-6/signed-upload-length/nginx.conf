# The production media path and nothing else: TLS, HTTP/2, and the very
# snippets/media.conf the site's two /devpath-media locations include,
# in front of the dev stack's RustFS (`storage` on devpath_default).
#
# The one addition is the access log, which records what Chrome sent: a
# Content-Length, or a body with no length. The query string -- the
# signature -- is left out of it.

events {}

http {
    log_format upload '$request_method $uri $server_protocol '
                      'content_length=$content_length '
                      'transfer_encoding=$http_transfer_encoding '
                      'request_length=$request_length status=$status';
    access_log /dev/stdout upload;
    server_tokens off;

    server {
        listen 443 ssl;
        http2 on;
        server_name devpath.localhost;
        # Docker's own DNS: media.conf proxies to a variable, which nginx
        # resolves at request time.
        resolver 127.0.0.11 valid=10s;

        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        # A page to stand on, so the uploads below are same-origin, as they
        # are on the site.
        location = / {
            add_header Content-Type text/html;
            return 200 "<!doctype html><title>upload probe</title>";
        }

        location = /devpath-media {
            include /etc/nginx/snippets/media.conf;
        }
        location /devpath-media/ {
            include /etc/nginx/snippets/media.conf;
        }
    }
}
