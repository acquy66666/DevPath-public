# The media bucket: the `storage` service (RustFS), on the site's own origin.
# Included by the two /devpath-media locations in templates/default.conf.template.
# Decision and the tests behind every line: docs/report/assets/phase-6/
# storage-decision.txt and rustfs-compose.txt.

# Host passed through unchanged -- proxy.conf sets it, among the rest. SigV4
# signs the Host header, so the server must check a presigned URL against
# the name it was signed for, ${DOMAIN}, not against `storage`. Measured:
# without it every browser upload is a 403.
include /etc/nginx/snippets/proxy.conf;

set $media_upstream http://storage:9000;
proxy_pass $media_upstream;
proxy_http_version 1.1;

# An original video is uploaded whole, in one presigned PUT. Stream it to the
# server rather than spool it to nginx's disk first, and allow up to the 2 GB
# the API will sign for (MAX_UPLOAD_BYTES in backend/app/services/storage.py)
# -- the 2m of the rest of the site would refuse every video.
client_max_body_size 2g;
proxy_request_buffering off;
proxy_buffering off;
# A large upload on a slow connection: the default 60s is between two reads,
# not for the whole body, so this only matters if a client stalls.
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Everything here was uploaded by somebody, and it is served from the same
# origin as the app. The bucket only takes the content types the API signs
# (images, video, text, PDF, HLS -- never HTML or SVG), but if anything here
# were ever opened as a page, it must not run as this site: `sandbox` gives
# such a document no scripts and an origin of its own. `<img>`, `<video>` and
# hls.js ignore a policy on what they fetch, so playback is unaffected.
add_header Content-Security-Policy "sandbox; default-src 'none'" always;
# A location with add_header of its own inherits none of the server's.
include /etc/nginx/snippets/security-headers.conf;
